name: 🌀 Deploy TARDIS to GitHub Pages

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
# Pull requests get their own group so a queued PR build can't displace a queued deploy.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout TARDIS
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js (Sonic Screwdriver)
        uses: actions/setup-node@v4
        with:
            node-version: '24'

      - name: 🔧 Enable Corepack
        run: corepack enable

      - name: 🧰 Cache Yarn cache (Berry)
        uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: 🛠️ Install temporal dependencies
        run: yarn install --immutable

      - name: 🔍 Run SCSS diagnostics (Linting)
        run: yarn lint:scss

      - name: ✨ Format check (Prettier)
        run: yarn format:check

      - name: 🎨 Compile SCSS to CSS (Regenerate styles)
        run: yarn build-css

      - name: 📄 Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: 🚀 Upload TARDIS artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  # Deployment job
  # Pull requests only build: the github-pages environment accepts deploys from master alone.
  deploy:
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 🌟 Deploy TARDIS to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
